      if(audio.state==='suspended')audio.resume();
      var o=audio.createOscillator(),g=audio.createGain();
      o.type=type||'triangle';o.frequency.value=f;g.gain.value=.03;
      g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);
      o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d);
    }catch(e){}
  }
  function tone(type,f0,f1,start,dur,vol){
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    var o=audio.createOscillator(),g=audio.createGain(),t0=audio.currentTime+start;
    o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(audio.destination);o.start(t0);o.stop(t0+dur+.02);
  }
  var memes=[
    {n:'Bruh.',p:function(){tone('square',220,80,0,.35,.09);}},
    {n:'AIRHORN!',p:function(){for(var i=0;i<3;i++){tone('sawtooth',470,440,i*.2,.16,.07);tone('sawtooth',630,600,i*.2,.16,.05);}}},
    {n:'Vine boom',p:function(){tone('sine',120,35,0,.6,.22);}},
    {n:'Oh no no no',p:function(){tone('triangle',500,300,0,.18,.1);tone('triangle',500,300,.25,.18,.1);tone('triangle',500,250,.5,.3,.1);}},
    {n:'Sheeesh',p:function(){tone('sawtooth',300,900,0,.7,.05);}}
  ];
  function meme(){
    if(muted)return;
    var m=memes[Math.floor(Math.random()*memes.length)];
    try{m.p();}catch(e){}
    memeCap=m.n;memeT=70;
  }
  function sadTrombone(){
    if(muted)return;
    try{[[233,0],[220,.3],[207,.6]].forEach(function(n){tone('sawtooth',n[0],n[0]*.98,n[1],.28,.07);});
    tone('sawtooth',196,150,.9,.8,.07);}catch(e){}
  }
  function reset(){
    bird={y:H/2-60,vy:0,rot:0};
    pipes=[];score=0;dist=0;memeAt=3;memeCap='';memeT=0;
    for(var i=0;i<3;i++)addPipe(W+160+i*SPACING);
  }
  function addPipe(x){
    var top=80+Math.random()*(H-GROUND-GAP-160);
    pipes.push({x:x,top:top,scored:false});
  }
  function flap(){
    if(paused){paused=false;musicOn();return;}
    if(state==='ready'){state='play';try{bgm.currentTime=0}catch(e){}musicOn();}
    if(state==='play'){bird.vy=FLAP;beep(520,.08);buzz(8);}
    else if(state==='over'&&t>25){state='ready';layout();reset();}
  }
  function die(){
    if(state!=='play')return;
    state='over';t=0;bgm.pause();flash=1;shake=8;sadTrombone();buzz([60,40,90]);
    hist.unshift(score);hist=hist.slice(0,6);try{localStorage.setItem('badshah-hist',JSON.stringify(hist))}catch(e){}
    if(score>best){best=score;try{localStorage.setItem('duskflap-best',best)}catch(e){}}
  }
  function update(){
    if(paused)return;
    t++;
    clouds.forEach(function(c){c.x-=c.s*(state==='over'?0:1);if(c.x<-c.w)c.x=W+20});
    if(state==='ready'){bird.y=H/2-60+Math.sin(t/12)*8;bird.rot=0;return;}
    if(state==='play'){
      bird.vy+=G;bird.y+=bird.vy;
      bird.rot=Math.max(-.4,Math.min(1.0,bird.vy*.06));
      dist+=SPEED;
      pipes.forEach(function(p){p.x-=SPEED;
        if(!p.scored&&p.x+PW<BX-R){p.scored=true;score++;beep(780,.08,'square');if(score>=memeAt){meme();memeAt=score+4+Math.floor(Math.random()*4);}}
      });
      if(pipes[0].x<-PW-10){pipes.shift();addPipe(pipes[pipes.length-1].x+SPACING);}
      if(bird.y+R>H-GROUND){bird.y=H-GROUND-R;die();}
      if(bird.y-R<0){bird.y=R;bird.vy=0;}
      pipes.forEach(function(p){
        if(BX+R-4>p.x&&BX-R+4<p.x+PW){
          if(bird.y-R+4<p.top||bird.y+R-4>p.top+GAP)die();
        }
      });
    } else if(state==='over'){
      if(bird.y+R<H-GROUND){bird.vy+=G*1.2;bird.y+=bird.vy;bird.rot=Math.min(1.5,bird.rot+.08);}
      else bird.y=H-GROUND-R;
    }
    flash*=.9;shake*=.85;if(memeT>0)memeT--;
  }
  function sky(){
    if(bg)ctx.drawImage(bg,0,0,W,H);
    ctx.fillStyle='rgba(20,21,58,.55)';
    clouds.forEach(function(c){
      ctx.beginPath();ctx.ellipse(c.x+c.w/2,c.y,c.w/2,12,0,0,6.3);ctx.fill();
      ctx.beginPath();ctx.ellipse(c.x+c.w*.35,c.y-8,c.w*.22,11,0,0,6.3);ctx.fill();
    });
  }
  function person(x,y,h){
    var ph=PW*283/190;
    var g=ctx.createLinearGradient(x,0,x+PW,0);
    g.addColorStop(0,'#6e1426');g.addColorStop(.5,'#96202f');g.addColorStop(1,'#6e1426');
    ctx.fillStyle=g;ctx.fillRect(x,y+ph-8,PW,h-ph+8);
    ctx.fillStyle='rgba(20,5,10,.55)';ctx.fillRect(x+PW/2-1,y+ph-8,2,h-ph+8);
    ctx.fillStyle='#14080c';
    for(var k=y+ph+30;k<y+h;k+=64){ctx.beginPath();ctx.arc(x+PW/2-14,k,3,0,6.3);ctx.fill();ctx.beginPath();ctx.arc(x+PW/2+14,k,3,0,6.3);ctx.fill();}
    if(pimg.complete&&pimg.naturalWidth)ctx.drawImage(pimg,x,y,PW,ph);
  }
  function pillar(x,y,h,flip){
    if(h<=0)return;
    ctx.save();
    ctx.beginPath();ctx.rect(x,y,PW,h);ctx.clip();
    if(flip){ctx.translate(0,y+h);ctx.scale(1,-1);person(x,0,h);}
    else person(x,y,h);
    ctx.restore();
  }
  function drawBird(){
    ctx.save();ctx.translate(BX,bird.y);ctx.rotate(bird.rot);
    if(sprite.complete&&sprite.naturalWidth){
      var pulse=state==='over'?1:1+Math.sin(t/6)*.03;
      ctx.scale(pulse,pulse);
      ctx.drawImage(sprite,-SW/2,-SH/2,SW,SH);
      ctx.lineWidth=2.5;ctx.strokeStyle='#f6efd9';ctx.beginPath();ctx.arc(0,0,SW/2-1,0,6.3);ctx.stroke();
    } else {ctx.fillStyle='#f6efd9';ctx.beginPath();ctx.arc(0,0,R,0,6.3);ctx.fill();}
    ctx.restore();
  }
  function ground(){
    var gy=H-GROUND;
    ctx.fillStyle='#0d1230';ctx.fillRect(0,gy,W,GROUND);
    ctx.fillStyle='#4a2a5a';ctx.fillRect(0,gy,W,4);
    var off=(dist%48);
    ctx.fillStyle='#1c2557';
    for(var x=-off;x<W;x+=48)ctx.fillRect(x,gy+22,28,6);
    for(var x2=-off+24;x2<W;x2+=48)ctx.fillRect(x2,gy+46,28,6);
  }
  function text(s,x,y,size,col){
    ctx.font='bold '+size+'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';ctx.fillStyle=col||'#f6efd9';ctx.fillText(s,x,y);
  }
  function draw(){
    ctx.save();
    if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    sky();
    pipes.forEach(function(p){
      pillar(p.x,0,p.top,true);
      pillar(p.x,p.top+GAP,H-GROUND-(p.top+GAP),false);
    });
    ground();drawBird();
    if(state!=='ready'){
      text('Badshah Score',W/2,52,15,'#d8d3f0');
      ctx.lineWidth=5;ctx.strokeStyle='#14153a';ctx.lineJoin='round';
      ctx.font='bold 56px "Trebuchet MS","Segoe UI",system-ui,sans-serif';ctx.textAlign='center';
      ctx.strokeText(score,W/2,108);text(score,W/2,108,56);
      if(memeT>0){ctx.globalAlpha=Math.min(1,memeT/20);text(memeCap,W/2,150,26,'#ffd36b');ctx.globalAlpha=1;}
    }
    if(state==='ready'){
      text('Badshah Saves',W/2,H*.2,40);
      text('Fly the face between the towers.',W/2,H*.2+34,15,'#d8d3f0');
      text('Tap to start',W/2,H-GROUND-44,22,'#ff8a7a');
      if(best)text('Best '+best,W/2,H-GROUND-16,16,'#d8d3f0');
    }
    if(state==='over'){
      var y0=H/2-160;
      ctx.fillStyle='rgba(13,18,48,.9)';
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(55,y0,290,320,14);else ctx.rect(55,y0,290,320);
      ctx.fill();
      text('Game over',W/2,y0+42,26);
      text('Badshah Score',W/2,y0+76,16,'#d8d3f0');
      text(score,W/2,y0+134,60,'#ffd36b');
      text('Best '+best,W/2,y0+164,17,'#ff8a7a');
      var prev=hist.slice(1,6);
      if(prev.length){
        text('Pichhle games',W/2,y0+200,14,'#d8d3f0');
        text(prev.join('    '),W/2,y0+228,22);
      }
      if(t>25)text('Tap to play again',W/2,y0+292,17,'#d8d3f0');
    }
    if(paused){ctx.fillStyle='rgba(13,18,48,.7)';ctx.fillRect(0,0,W,H);text('Paused',W/2,H/2-6,34);text('Tap to resume',W/2,H/2+28,17,'#d8d3f0');}
    ctx.restore();
    if(flash>.05){ctx.fillStyle='rgba(255,255,255,'+flash*.6+')';ctx.fillRect(0,0,W,H);}
  }
  var last=0,acc=0;
  function loop(ts){
    acc+=Math.min(50,ts-last);last=ts;
    while(acc>=1000/60){update();acc-=1000/60;}
    draw();requestAnimationFrame(loop);
  }
  layout();reset();
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',function(){setTimeout(layout,200)});
  requestAnimationFrame(function(ts){last=ts;loop(ts)});
  function autoPause(){if(state==='play'&&!paused){paused=true;bgm.pause();}}
  document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause();});
  window.addEventListener('pagehide',autoPause);
  window.addEventListener('blur',autoPause);
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)flap();}
  });
  document.body.addEventListener('pointerdown',function(e){e.preventDefault();flap();});
})();
</script>
</body>
